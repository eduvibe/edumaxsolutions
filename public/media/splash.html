<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bravo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f5f5f5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; color: #171717; user-select: none;
    -webkit-app-region: drag;
  }
  .logo {
    width: 108px; height: 108px; border-radius: 26px;
    background: #fff;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .12), 0 2px 8px rgba(0, 0, 0, .08);
    object-fit: contain;
    padding: 10px;
  }
  h1 { font-size: 27px; font-weight: 800; letter-spacing: .4px; margin-top: 20px; color: #171717; }
  .tag { font-size: 13px; color: #737373; margin-top: 6px; letter-spacing: .2px; }
  .dots { display: flex; gap: 9px; margin-top: 30px; }
  .dots i {
    width: 10px; height: 10px; border-radius: 50%; background: #171717; opacity: .25;
    animation: bounce 1.05s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .25; }
    40%           { transform: translateY(-10px); opacity: 1; }
  }
  .ring {
    position: absolute; bottom: 88px; width: 150px; height: 3px; border-radius: 3px;
    background: #e5e5e5; overflow: hidden;
  }
  .ring::after {
    content: ""; position: absolute; left: -40%; top: 0; height: 100%; width: 40%;
    background: #171717;
    animation: sweep 1.4s linear infinite;
  }
  @keyframes sweep { to { left: 110%; } }
  .powered {
    position: absolute; bottom: 26px; font-size: 12px; color: #737373; letter-spacing: .3px;
  }
  .powered b { color: #171717; }
</style>
</head>
<body>
  <img class="logo" src="./chtlogo.png" alt="Bravo">
  <h1>Bravo</h1>
  <div class="tag">Offline JAMB &amp; WAEC practice</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="ring"></div>
  <div class="powered">Powered by <b>Edumax Solutions</b></div>
</body>
</html>
